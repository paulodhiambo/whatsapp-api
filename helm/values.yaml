replicaCount: 2

image:
  repository: ghcr.io/paulodhiambo/whatsapp-api
  pullPolicy: IfNotPresent
  tag: 11b31e4

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

ingress:
  enabled: true
  baseDomain: cluster.lakesideinn.space
  auth:
    enabled: false

probes:
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# Custom environment variables for the application
env: []
# - name: PORT
#   value: "3000"
# - name: SESSION_TTL_MS
#   value: "21600000"

# References to ConfigMaps/Secrets for environment variables (like DATABASE_URL or secrets)
envFrom:
  - secretRef:
      name: whatsapp-api-secrets

